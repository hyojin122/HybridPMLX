[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridpmlx"
version = "0.3.0"
description = "Configurable hybrid MLP-pharmacometric modeling with OOF evaluation and parameter-specific SHAP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hyojin Cho"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "torch>=2.1",
  "shap>=0.45",
  "matplotlib>=3.8",
]

[project.scripts]
hybridpmlx = "hybridpmlx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
